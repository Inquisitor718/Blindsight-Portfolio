  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    /* ─── BACKGROUND IMAGE LAYER ─────────────────────────────── */

    /* The image stretches to full width, height is natural (scrollable) */

    #bg-image {
      display: block;
      width: 100%;
      height: auto;
      position: relative;
      z-index: 0;
    }

    /* ─── OVERLAY LAYER ──────────────────────────────────────── */

    /* Sits on top of the image, same dimensions, absolutely positioned */

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;

      /* Height is set by JS to match image height */

      z-index: 1;
      pointer-events: none;
    }

    /* Wrapper so overlay + image scroll together */

    #page {
      position: relative;
      width: 100%;
    }

    /* ─── EMBED BLOCKS ───────────────────────────────────────── */

    .embed-block {
      position: absolute;
      pointer-events: all;
    }

    /* ─── GIFS ───────────────────────────────────────── */

    .gif-embed {
      position: absolute;
      pointer-events: none;
      overflow: hidden;
    }

    .gif-embed img {
      display: block;
      width: 100%;
      height: auto;
    }





    /* ─── ITCH.IO GAME ───────────────────────────────────────── */

    .itchio-embed {
      border: none;
      display: block;
      overflow: hidden;
    }

    .itchio-embed iframe {
      border: none;
      display: block;
      width: 100%;
      height: 100%;
    }


    /* ─── GAME SOUND BUTTON ───────────────────────── */

#game-sound-button {
  position: absolute;
  top: 14px;
  right: 14px;

  width: 46px;
  height: 46px;

  border: 2px solid rgba(255, 255, 255, 0.8);
  border-radius: 50%;

  background: rgba(0, 0, 0, 0.75);
  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  z-index: 20;

  pointer-events: all;

  transition:
    transform 0.15s ease,
    background 0.15s ease;
}

#game-sound-button:hover {
  transform: scale(1.1);
  background: rgba(30, 30, 30, 0.95);
}

#game-sound-button svg {
  width: 23px;
  height: 23px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Small text underneath the icon */
#game-sound-label {
  position: absolute;

  top: 50px;
  right: 0;

  white-space: nowrap;

  font-family: monospace;
  font-size: 10px;

  color: white;

  background: rgba(0, 0, 0, 0.7);

  padding: 3px 6px;
  border-radius: 3px;

  pointer-events: none;
}

    /* ─── VIDEO EMBEDS ───────────────────────────────────────── */

    .video-embed iframe,
    .video-embed video {
      border: none;
      display: block;
      width: 100%;
      height: 100%;
    }

    .video-embed {
      overflow: hidden;
    }

    /* ─── EDIT HINT ──────────────────────────────────────────── */

    #edit-hint {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-family: monospace;
      font-size: 12px;
      padding: 10px 14px;
      border-radius: 6px;
      z-index: 999;
      line-height: 1.6;
      max-width: 300px;
    }

    #edit-hint strong {
      color: #f0c040;
    }

  </style>

<script>

  /* ═══════════════════════════════════════════════
     OVERLAY HEIGHT
  ═══════════════════════════════════════════════ */

  const img = document.getElementById('bg-image');
  const overlay = document.getElementById('overlay');

  function syncHeight() {
    overlay.style.height = img.offsetHeight + 'px';
  }

  img.addEventListener('load', syncHeight);
  window.addEventListener('resize', syncHeight);

  if (img.complete) {
    syncHeight();
  }


  /* ═══════════════════════════════════════════════
   STOP GAME FROM AUTO-SCROLLING
  ══════════════════════════════════════════════ */

  const gameFrame = document.getElementById('game-frame');

  if ('scrollRestoration' in history) {
    history.scrollRestoration = 'manual';
  }

  // Remember where the user was before the game loads
  const pageScrollBeforeGame = window.scrollY;


  // Restore the page position
  function restorePageScroll() {
    window.scrollTo({
      top: pageScrollBeforeGame,
      left: 0,
      behavior: 'instant'
    });
  }


  // When the game loads
  gameFrame.addEventListener('load', function () {

    gameFrame.blur();

    // Restore several times because Godot can
    // focus its canvas slightly after iframe load.
    restorePageScroll();

    setTimeout(restorePageScroll, 50);
    setTimeout(restorePageScroll, 150);
    setTimeout(restorePageScroll, 300);
    setTimeout(restorePageScroll, 600);
    setTimeout(restorePageScroll, 1000);

  });


  /* ═══════════════════════════════════════════════
     GAME SOUND BUTTON
  ═══════════════════════════════════════════════ */

  const soundButton =
    document.getElementById('game-sound-button');

  const soundOffIcon =
    document.getElementById('sound-icon-off');

  const soundOnIcon =
    document.getElementById('sound-icon-on');

  const soundLabel =
    document.getElementById('game-sound-label');


  // IMPORTANT:
// Sound starts OFF.
  let gameSoundOn = false;


  function updateSoundButton() {

    if (gameSoundOn) {

      soundOffIcon.style.display = 'none';
      soundOnIcon.style.display = 'block';

      soundLabel.textContent = 'SOUND ON';

      soundButton.setAttribute(
        'aria-label',
        'Turn sound off'
      );

    } else {

      soundOffIcon.style.display = 'block';
      soundOnIcon.style.display = 'none';

      soundLabel.textContent = 'SOUND OFF';

      soundButton.setAttribute(
        'aria-label',
        'Turn sound on'
      );
    }
  }


  soundButton.addEventListener('click', function(e) {

    e.preventDefault();
    e.stopPropagation();

    gameSoundOn = !gameSoundOn;

    updateSoundButton();


    // Tell the Godot game what the new state is.

    gameFrame.contentWindow.postMessage(
      {
        type: 'portfolio_sound',
        enabled: gameSoundOn
      },
      window.location.origin
    );

  });


  // Set initial appearance
  updateSoundButton();


</script>
