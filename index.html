```html
<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Portfolio</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    /* ─── BACKGROUND IMAGE LAYER ─────────────────────────────── */

    /* The image stretches to full width, height is natural (scrollable) */

    #bg-image {
      display: block;
      width: 100%;
      height: auto;
      position: relative;
      z-index: 0;
    }

    /* ─── OVERLAY LAYER ──────────────────────────────────────── */

    /* Sits on top of the image, same dimensions, absolutely positioned */

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;

      /* Height is set by JS to match image height */

      z-index: 1;
      pointer-events: none;
    }

    /* Wrapper so overlay + image scroll together */

    #page {
      position: relative;
      width: 100%;
    }

    /* ─── EMBED BLOCKS ───────────────────────────────────────── */

    .embed-block {
      position: absolute;
      pointer-events: all;
    }

    /* ─── ITCH.IO GAME ───────────────────────────────────────── */

    .itchio-embed {
      border: none;
      display: block;
      overflow: hidden;
    }

    .itchio-embed iframe {
      border: none;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ─── VIDEO EMBEDS ───────────────────────────────────────── */

    .video-embed iframe,
    .video-embed video {
      border: none;
      display: block;
      width: 100%;
      height: 100%;
    }

    .video-embed {
      overflow: hidden;
    }

    /* ─── EDIT HINT ──────────────────────────────────────────── */

    #edit-hint {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-family: monospace;
      font-size: 12px;
      padding: 10px 14px;
      border-radius: 6px;
      z-index: 999;
      line-height: 1.6;
      max-width: 300px;
    }

    #edit-hint strong {
      color: #f0c040;
    }

  </style>

</head>

<body>

<div id="page">

  <!-- ① BACKGROUND IMAGE — replace src with your Figma export -->

  <img
    id="bg-image"
    src="Frame 1.png"
    alt="Portfolio Background"
  />


  <!-- ② OVERLAY — embeds go inside here -->

  <div id="overlay">


    <!-- ══════════════════════════════════════════════
         ITCH.IO GAME
         • top: vertical position
         • left: horizontal position
         • width: game width
         • aspect-ratio: game proportions
    ═══════════════════════════════════════════════ -->

    <div
      class="embed-block itchio-embed"
      style="
        top: 96%;
        left: 50%;
        transform: translateX(-50%);
        width: 80%;
        aspect-ratio: 16 / 9;
      "
    >

      <iframe
        src="game/index.html"
        width="100%"
        height="100%"
        frameborder="0"
        allowfullscreen>
      </iframe>

    </div>


    

    <!-- ══════════════════════════════════════════════
         LOCAL VIDEO EMBED
         Uncomment to use
    ═══════════════════════════════════════════════ -->

    <!--

    <div
      class="embed-block video-embed"
      style="
        top: 75%;
        left: 25%;
        width: 50%;
        aspect-ratio: 16 / 9;
      "
    >

      <video controls>
        <source src="your-video.mp4" type="video/mp4" />
      </video>

    </div>

    -->

  </div>
  <!-- /overlay -->

</div>
<!-- /page -->


<!-- ══════════════════════════════════════════════
     EDIT HINT — delete this block when finished
═══════════════════════════════════════════════ -->

<div id="edit-hint">

  <strong>How to customise:</strong><br>

  1. Replace <code>Frame 1.png</code> with your background image<br>

  2. Replace the itch.io game ID / link<br>

  3. Replace YouTube VIDEO_ID_1 / VIDEO_ID_2<br>

  4. Adjust <code>top / left / width %</code> values<br>

  5. Delete this hint block

</div>


<script>

  /* Makes overlay height always match image height */

  const img = document.getElementById('bg-image');
  const overlay = document.getElementById('overlay');

  function syncHeight() {
    overlay.style.height = img.offsetHeight + 'px';
  }

  img.addEventListener('load', syncHeight);

  window.addEventListener('resize', syncHeight);

  /* In case image is already cached */

  if (img.complete) {
    syncHeight();
  }

</script>


</body>

</html>
```
